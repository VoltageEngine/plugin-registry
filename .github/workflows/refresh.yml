name: Refresh plugin versions

# Keeps every listed plugin pointing at its own latest release, so the catalogue tracks releases without
# anyone editing this file.
#
# The plugin side already tries to do this: each plugin repository's Release workflow calls its
# submit-to-registry job, which opens a pull request here. That path needs a REGISTRY_TOKEN secret on
# every plugin repository - a fine-grained PAT with write access here - and without it the job only warns
# and prints the entry to paste. A third-party plugin author will never have that token at all.
#
# This runs from the other end instead. The registry asks each plugin it already lists what its latest
# release is, using nothing but this repository's own GITHUB_TOKEN, so there is no secret to create,
# distribute or rotate.
#
# It deliberately cannot add or remove a plugin, and touches only Ref and Zip. Which plugins are listed,
# and everything descriptive about them, stays curated and arrives by pull request - the same property the
# plugin-side job was written to protect. All this does is stop a curated entry going stale.

on:
  schedule:
    # Every three hours. A release is not urgent enough for a minute-by-minute poll, and the plugin-side
    # pull request still lands immediately wherever a token is configured.
    - cron: '0 */3 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Point every entry at its latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import json, pathlib, re, subprocess

          registry = pathlib.Path("registry.json")
          data     = json.loads(registry.read_text(encoding="utf-8"))
          changed  = []

          for plugin in data.get("Plugins", []):
              git = plugin.get("Git") or ""
              match = re.search(r"github\.com[/:]([^/]+/[^/]+?)(?:\.git)?$", git)

              if not match:
                  print(f"skip {plugin.get('Id')}: no GitHub repository in {git!r}")
                  continue

              repo = match.group(1)

              # A repository with no releases yet, or one this token cannot see, is not an error - the
              # entry simply stays as curated.
              result = subprocess.run(
                  ["gh", "release", "view", "--repo", repo, "--json", "tagName,assets"],
                  capture_output=True, text=True)

              if result.returncode != 0:
                  print(f"skip {plugin.get('Id')}: {result.stderr.strip().splitlines()[-1] if result.stderr.strip() else 'no release'}")
                  continue

              release = json.loads(result.stdout)
              tag     = release.get("tagName")
              zips    = [a for a in release.get("assets", []) if a.get("name", "").endswith(".zip")]

              if not tag or not zips:
                  print(f"skip {plugin.get('Id')}: latest release has no .zip asset")
                  continue

              if plugin.get("Ref") == tag and plugin.get("Zip") == zips[0]["url"]:
                  continue

              print(f"{plugin.get('Id')}: {plugin.get('Ref')} -> {tag}")
              plugin["Ref"] = tag
              plugin["Zip"] = zips[0]["url"]
              changed.append(f"{plugin.get('Id')} {tag}")

          if changed:
              registry.write_text(json.dumps(data, indent="\t", ensure_ascii=False) + "\n", encoding="utf-8")

          pathlib.Path("changed.txt").write_text(", ".join(changed), encoding="utf-8")
          PY

      - name: Commit what moved
        run: |
          if git diff --quiet -- registry.json; then
            echo "Every entry already points at its latest release."
            exit 0
          fi

          CHANGED=$(cat changed.txt)

          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -qm "Track latest release: ${CHANGED}" -- registry.json
          git push -q

          echo "Updated: ${CHANGED}" >> "$GITHUB_STEP_SUMMARY"
